[workspace]
members = ["site", "site_internal", "xtask"]
default-members = ["site"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
comrak = { version = "0.54.0", default-features = false }
html-escape = "0.3.0"
html-minifier = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
maud = "0.27.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rayon = "1.12.0"
resvg = { version = "0.47", default-features = false, features = ["raster-images", "text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
site_internal = { path = "site_internal" }
slug = "0.1.6"
streaming-iterator = "0.1.9"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
thumbhash = "0.1.0"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-containerfile = "0.9.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tsquery = "0.8.0"
tree-sitter-typescript = "0.23.2"
unicode-segmentation = "1.13.3"

[profile.dev]
opt-level = 0
debug = false
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0
debug = false

[profile.release]
opt-level = 2
strip = "symbols"
lto = false
panic = "abort"
codegen-units = 32
incremental = true
