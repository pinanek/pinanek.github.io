[package]
name = "garden"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
comrak = { version = "0.54.0", default-features = false }
html-escape = "0.3.0"
html-minifier = "6.0.0"
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
maud = "0.27.0"
rayon = "1.12.0"
resvg = { version = "0.47", default-features = false, features = ["raster-images", "text"] }
serde = { version = "1", features = ["derive"] }
slug = "0.1.6"
strum = { version = "0.28", features = ["derive"] }
thumbhash = "0.1.0"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-containerfile = "0.9.2"
tree-sitter-css = "0.25.0"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unicode-segmentation = "1.13.3"
url = "2.5.8"

[profile.dev]
opt-level = 0
debug = false
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0
debug = false

[profile.release]
opt-level = 2
strip = "symbols"
lto = false
panic = "abort"
codegen-units = 32
incremental = true
